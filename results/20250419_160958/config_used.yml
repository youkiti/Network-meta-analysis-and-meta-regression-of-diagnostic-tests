# Network meta-analysis and meta-regression configuration

# Data settings
data:
  filename: "Sepsis_nma_data.csv"
  markers:
    - "qSOFA"
    - "PCT"
    - "presepsin"
    - "CRP"
    - "CD64"
    - "IL-6"
    - "sTREM-1"
    - "LBP"
    - "SIRS"
    - "SOFA"
  reference_marker: "qSOFA"

# NMA model settings
nma:
  iter: 300  # 実験をより速く行うためにさらに少なくする
  chains: 2
  cores: 2
  adapt_delta: 0.99
  stepsize: 0.01
  max_treedepth: 17

# Meta-regression settings
meta_regression:
  run: false
  covariate: "is.prevalence05"
  iter: 1000
  chains: 2
  cores: 2
  adapt_delta: 0.99
  stepsize: 0.01
  max_treedepth: 17

# Results management
results:
  prune_old_results: true
  keep_last_n_results: 5

# Random seed (for reproducibility)
seed: 12345
