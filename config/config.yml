# ネットワークメタアナリシスとメタ回帰分析の設定ファイル

# データ設定
data:
  filename: "Sepsis_nma_data.csv"
  markers:
    - "qSOFA"
    - "PCT"
    - "presepsin"
    - "CRP"
    - "CD64"
    - "IL-6"
    - "sTREM-1"
    - "LBP"
    - "SIRS"
    - "SOFA"
  reference_marker: "qSOFA"

# NMAモデル設定
nma:
  iter: 20000
  chains: 4
  cores: 4
  adapt_delta: 0.99
  stepsize: 0.01
  max_treedepth: 17

# メタ回帰設定
meta_regression:
  run: true
  covariate: "is.prevalence05"
  iter: 20000
  chains: 4
  cores: 4
  adapt_delta: 0.99
  stepsize: 0.01
  max_treedepth: 17

# 結果管理
results:
  prune_old_results: true
  keep_last_n_results: 5

# 乱数シード（再現性のため）
seed: 12345
